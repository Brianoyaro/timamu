<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Therapist Availability - Weekly & Monthly Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
  <!-- Header -->
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">My Availability</h1>
    <div class="flex gap-2">
      <button id="prevMonthBtn" class="px-3 py-1 rounded bg-gray-200">◀</button>
      <span id="monthLabel" class="font-semibold self-center"></span>
      <button id="nextMonthBtn" class="px-3 py-1 rounded bg-gray-200">▶</button>
      <button id="weekViewBtn" class="px-3 py-1 rounded bg-blue-600 text-white">Week</button>
      <button id="monthViewBtn" class="px-3 py-1 rounded bg-gray-200">Month</button>
      <button id="saveBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow">Save</button>
    </div>
  </header>

  <!-- Weekly Grid -->
  <div id="weekView" class="grid grid-cols-7 gap-2 mb-6"></div>

  <!-- Monthly Grid -->
  <div id="monthView" class="hidden grid grid-cols-7 gap-2"></div>

  <!-- Modal -->
  <div id="slotModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-xl shadow-lg w-80">
      <h2 id="modalTitle" class="text-lg font-semibold mb-4">Add Availability</h2>
      <form id="slotForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Start Time</label>
          <input type="time" id="startTime" required class="mt-1 w-full border rounded-md px-2 py-1">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">End Time</label>
          <input type="time" id="endTime" required class="mt-1 w-full border rounded-md px-2 py-1">
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button type="button" id="cancelBtn" class="px-4 py-2 rounded-lg bg-gray-200">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const weekDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const weekView = document.getElementById("weekView");
    const monthView = document.getElementById("monthView");
    const weekBtn = document.getElementById("weekViewBtn");
    const monthBtn = document.getElementById("monthViewBtn");
    const modal = document.getElementById("slotModal");
    const form = document.getElementById("slotForm");
    const startInput = document.getElementById("startTime");
    const endInput = document.getElementById("endTime");
    const cancelBtn = document.getElementById("cancelBtn");
    const modalTitle = document.getElementById("modalTitle");
    const monthLabel = document.getElementById("monthLabel");
    const prevMonthBtn = document.getElementById("prevMonthBtn");
    const nextMonthBtn = document.getElementById("nextMonthBtn");

    let activeDay = null;
    let availability = {};
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    // Generate weekly grid
    function renderWeek() {
      weekView.innerHTML = "";
      weekDays.forEach(day => {
        const col = document.createElement("div");
        col.className = "bg-white border rounded-lg shadow p-2 flex flex-col";
        col.innerHTML = `
          <div class="font-semibold text-center mb-2">${day}</div>
          <div id="slots-${day}" class="flex flex-col gap-1 mb-2"></div>
          <button class="bg-green-500 hover:bg-green-600 text-white rounded px-2 py-1 text-sm addBtn" data-day="${day}">+ Add Slot</button>
        `;
        weekView.appendChild(col);
        if (!availability[day]) availability[day] = [];
      });
    }
    renderWeek();

    // Generate monthly grid
    function renderMonth(year, month) {
      monthView.innerHTML = "";
      const today = new Date();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      monthLabel.textContent = new Date(year, month).toLocaleString("default", { month: "long", year: "numeric" });

      for (let i = 0; i < firstDay; i++) {
        monthView.appendChild(document.createElement("div")); // blank cells
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateKey = `${year}-${month+1}-${d}`;
        if (!availability[dateKey]) availability[dateKey] = [];

        const cell = document.createElement("div");
        cell.className = "bg-white border rounded-lg shadow p-2 flex flex-col relative";

        // Prevent past days
        const thisDate = new Date(year, month, d);
        const isPast = thisDate < new Date(today.getFullYear(), today.getMonth(), today.getDate());

        cell.innerHTML = `
          <div class="font-semibold text-sm mb-1">${d}</div>
          <div id="slots-${dateKey}" class="flex flex-col gap-1 mb-2"></div>
          ${isPast ? "" : `<button class="bg-green-500 hover:bg-green-600 text-white rounded px-2 py-1 text-xs addBtn" data-day="${dateKey}">+ Add Slot</button>`}
        `;
        monthView.appendChild(cell);
      }
    }
    renderMonth(currentYear, currentMonth);

    // Navigation
    prevMonthBtn.addEventListener("click", () => {
      const today = new Date();
      if (currentYear === today.getFullYear() && currentMonth === today.getMonth()) return;
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderMonth(currentYear, currentMonth);
    });

    nextMonthBtn.addEventListener("click", () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderMonth(currentYear, currentMonth);
    });

    // Switch views
    weekBtn.addEventListener("click", () => {
      weekView.classList.remove("hidden");
      monthView.classList.add("hidden");
      weekBtn.classList.add("bg-blue-600", "text-white");
      monthBtn.classList.remove("bg-blue-600", "text-white");
    });

    monthBtn.addEventListener("click", () => {
      monthView.classList.remove("hidden");
      weekView.classList.add("hidden");
      monthBtn.classList.add("bg-blue-600", "text-white");
      weekBtn.classList.remove("bg-blue-600", "text-white");
    });

    // Open modal
    document.addEventListener("click", e => {
      if (e.target.classList.contains("addBtn")) {
        activeDay = e.target.dataset.day;
        startInput.value = "";
        endInput.value = "";
        modalTitle.textContent = `Add Slot - ${activeDay}`;
        modal.classList.remove("hidden");
      }
    });

    // Cancel modal
    cancelBtn.addEventListener("click", () => {
      modal.classList.add("hidden");
    });

    // Form submit
    form.addEventListener("submit", e => {
      e.preventDefault();
      const start = startInput.value;
      const end = endInput.value;

      // Disallow invalid range
      if (start >= end) {
        alert("End time must be later than start time");
        return;
      }

      // Disallow past times for today
      const today = new Date();
      if (activeDay.includes("-")) {
        const [y, m, d] = activeDay.split("-").map(Number);
        const selectedDate = new Date(y, m-1, d);
        if (selectedDate.toDateString() === today.toDateString()) {
          const now = `${String(today.getHours()).padStart(2, "0")}:${String(today.getMinutes()).padStart(2, "0")}`;
          if (start < now) {
            alert("You cannot set availability in the past");
            return;
          }
        }
      }

      // Collision detection
      const conflicts = availability[activeDay].some(slot =>
        (start < slot.end && end > slot.start) // overlap
      );
      if (conflicts) {
        alert("Slot collides with an existing one");
        return;
      }

      availability[activeDay].push({ start, end });
      renderSlots(activeDay);
      modal.classList.add("hidden");
    });

    // Render slots
    function renderSlots(day) {
      const container = document.getElementById(`slots-${day}`);
      if (!container) return;
      container.innerHTML = "";
      availability[day].forEach((slot, index) => {
        const div = document.createElement("div");
        div.className = "bg-blue-100 text-blue-800 px-2 py-1 rounded flex justify-between items-center text-xs";
        div.innerHTML = `
          <span>${slot.start} - ${slot.end}</span>
          <button class="text-red-600 text-xs" onclick="deleteSlot('${day}', ${index})">✕</button>
        `;
        container.appendChild(div);
      });
    }

    // Delete slot
    window.deleteSlot = function(day, index) {
      availability[day].splice(index, 1);
      renderSlots(day);
    };

    // Save availability
    document.getElementById("saveBtn").addEventListener("click", () => {
      console.log("Saved availability:", availability);
      alert("Availability saved! (check console)");
    });
  </script>
</body>
</html>
